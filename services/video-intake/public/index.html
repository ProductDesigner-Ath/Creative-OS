<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative OS — Video Intake</title><style>body{margin:0;background:#11151a;color:#edf2f7;font:16px system-ui,sans-serif}main{max-width:760px;margin:8vh auto;padding:28px}h1{font-size:34px;margin:0 0 8px}.panel{margin-top:28px;padding:28px;border:1px solid #34404d;border-radius:16px;background:#19212a}input{margin:18px 0;width:100%}button{background:#9ae6b4;border:0;border-radius:8px;padding:12px 17px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;line-height:1.55;margin-top:20px}.quiet{color:#a7b4c2}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.frames img{width:100%;border-radius:5px}</style><main><p class="quiet">LOCAL ONLY · nothing is uploaded to GitHub or the internet</p><h1>Reference video intake</h1><p>Choose one video. Creative OS saves it locally, samples frames, detects major visual changes, and writes a reconstruction brief for After Effects.</p><div class="panel"><input id="file" type="file" accept="video/*,.m4v"><br><button id="run">Upload and analyze</button><div id="status"></div><div class="frames" id="frames"></div></div></main><script>
const file=document.querySelector('#file'),run=document.querySelector('#run'),status=document.querySelector('#status'),frames=document.querySelector('#frames');
const wait=e=>new Promise((ok,no)=>{e.addEventListener('loadedmetadata',ok,{once:true});e.addEventListener('error',()=>no(new Error('This browser could not decode the video. Convert it to H.264, then try again.')),{once:true});});
function sample(ctx,w,h){const d=ctx.getImageData(0,0,w,h).data;let l=0;for(let i=0;i<d.length;i+=16)l+=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];return l/(d.length/16)}
run.onclick=async()=>{if(!file.files[0])return status.textContent='Choose a video first.';run.disabled=true;frames.innerHTML='';try{const f=file.files[0];status.textContent='Uploading locally…';const upload=await fetch('/api/upload?filename='+encodeURIComponent(f.name),{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});if(!upload.ok)throw new Error((await upload.json()).message);const job=await upload.json(),video=document.createElement('video');video.preload='auto';video.src=job.uploadUrl;video.muted=true;video.playsInline=true;await wait(video);await new Promise(ok=>video.readyState>=2?ok():video.addEventListener('loadeddata',ok,{once:true}));const count=Math.min(24,Math.max(8,Math.round(video.duration*4))),canvas=document.createElement('canvas'),w=320,h=Math.round(video.videoHeight*320/video.videoWidth);canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{willReadFrequently:true}),metrics=[];status.textContent=`Analyzing ${count} samples across ${video.duration.toFixed(2)} seconds…`;for(let i=0;i<count;i++){const target=(video.duration*i)/(count-1);if(i>0){await new Promise((ok,no)=>{video.addEventListener('seeked',()=>setTimeout(ok,50),{once:true});video.addEventListener('error',()=>no(new Error('Video seek failed.')),{once:true});video.currentTime=target;});}ctx.drawImage(video,0,0,w,h);const metric=sample(ctx,w,h),blob=await new Promise(ok=>canvas.toBlob(ok,'image/png'));await fetch(`/api/jobs/${job.id}/frames/${i}.png`,{method:'POST',headers:{'Content-Type':'image/png'},body:blob});const img=new Image();img.src=URL.createObjectURL(blob);frames.append(img);metrics.push({sample:i,time:+video.currentTime.toFixed(3),luma:+metric.toFixed(2)});}const deltas=metrics.slice(1).map((x,i)=>({...x,change:+Math.abs(x.luma-metrics[i].luma).toFixed(2)})),cuts=deltas.filter(x=>x.change>28);const report={version:'0.1',jobId:job.id,source:f.name,createdAt:new Date().toISOString(),media:{duration:+video.duration.toFixed(3),width:video.videoWidth,height:video.videoHeight,sampledFrames:count},visualAnalysis:{cutCandidates:cuts,averageLuma:+(metrics.reduce((n,x)=>n+x.luma,0)/metrics.length).toFixed(2),motionAssessment:cuts.length?'Contains major visual changes; inspect the saved frames for cut timing.':'No major full-frame changes detected at the sample rate; likely continuous motion or subtle animation.'},reconstructionPlan:{nextStep:'Review local frame sequence and create an allowlisted AE scene recipe.',limitations:['This first local analyzer detects timing and full-frame visual change. It does not yet identify objects, typography, effects, or per-layer animation.']}};await fetch(`/api/jobs/${job.id}/report`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});status.textContent=`Done. ${count} frames and the report are saved locally.\nJob ${job.id}\n${cuts.length} major visual-change candidates found.\n\nNext: I will use this report to build the AE reconstruction recipe.`}catch(e){status.textContent='Analysis failed: '+e.message}finally{run.disabled=false}};
</script></html>
